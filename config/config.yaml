general:
  name: 洛璃
  timezone: Asia/Shanghai
telegram:
  mode: polling
access:
  defaultUserRole: blocked
  defaultChatRole: blocked
trigger:
  private: true
  mention: true
  reply: true
  command: true
  wakewords: [洛璃]
context:
  scope: chat
  limit:
    tokens: 32000
    maxMessages: 200
    minKeepTurns: 1
  # 活跃期：对话进行中不裁剪，让前缀缓存一直命中；安静满 5 分钟（≈ provider 缓存有效期）
  # 之后的第一轮才裁回上面的 limit。schema 默认是 0（关闭），这里显式开启。docs/02 §5.1.1
  active:
    windowMs: 300000
    tokens: 128000
    maxMessages: 1000
  background:
    enabled: true
    maxPerTurn: 20
concurrency:
  mode: parallel
  perKey: 3
  global: 8
  queueMax: 20
prompt:
  maxTokens: 12000
memory:
  dir: ./memory
  pubWriteMinRole: trusted
  softLimitTokens: 1500
  hardLimitTokens: 3000
agent:
  main:
    modelAlias: main
    maxSteps: 12
    downgradeAfterStep: 8
  agents:
    - name: researcher
      description: 在聊天记录、文件和网络中检索资料并给出带引用的结论
      modelAlias: low
      maxSteps: 20
      minRole: limited
      tools: [read_file, list_dir, grep, glob, search_messages, read_messages, get_message, web_fetch, web_search]
      resultMaxChars: 4000
      instructions: 使用最少的调用找到确定答案，输出结论、证据和不确定项。
    - name: coder
      description: 在工作目录内完成多文件读写与脚本执行类任务
      modelAlias: high
      maxSteps: 30
      minRole: trusted
      tools: [read_file, write_file, edit_file, move_file, list_dir, grep, glob, bash, python]
      resultMaxChars: 6000
      instructions: 先理解现有代码，再进行最小且完整的实现并验证。
    - name: summarizer
      description: 把大段文本压缩为结构化摘要
      modelAlias: low
      maxSteps: 3
      minRole: limited
      tools: []
      resultMaxChars: 3000
      instructions: 输出结论、要点、数据和不确定项。
tools:
  maxRegistered: 80
  maxCallsPerTurn: 40
  # 工具目录按需暴露（docs/07 §5、docs/11 的 tools.catalog 段）。外部工具（MCP / 插件 / custom_*）
  # 默认折叠成每组一行摘要，模型用 search_tools 展开 —— 而 mcp.enabled 出厂 false、自我扩展的
  # customTools 出厂关、出厂 plugins/ 是空目录（注意 plugins.enabled 默认就是 true，它只表示会去
  # 扫这个目录），所以**出厂折叠集为空**，提示词与以前逐字节一致；接进第一台 MCP server、或启用
  # 第一个带工具的插件，才看得出区别。
  # 下面几行是**示例，默认注释掉**：
  # catalog:
  #   resident: ['mcp__github__get_*'] # 强制常驻（优先级最高）：折叠整台 server 之后把几个常用的捞回来
  #                                      （写成 mcp__github__* 就是整台都不折叠了）
  #   defer: ['send_*', 'container_*'] # 反过来把点名的内建工具也折叠掉（要 deferExternal 开着才起作用）
  #   residentDescriptions: false     # 常驻段只列名字：描述在 API 的 tools 字段里已经完整送过一遍。
  #                                     建议先只开折叠、观察一段再翻它（两个一起动就分不清因果）
sandbox:
  mode: docker
  bypassRoles: [owner]
  network: none
approval:
  enabled: true
  skipForOwner: true
  # ⚠ enabled: true 只是「审批流水线开着」。**判定完全由 rules 决定** —— 规则表为空时
  # ApprovalRules.evaluate() 恒回「不需要审批」，于是 bash / python / write_file / edit_file /
  # move_file / memory_write 这几个标着「条件审批」的工具一个都不会停下来问（docs/27 · S-02）。
  # 空表时启动会记一条 approval.no_rules 警告，WebUI 的审批页也会说明。
  # pattern 走 RE2（线性时间，不支持反向引用），上界 128 字符；求值对象是模型给的整份工具参数 JSON。
  rules:
    - tool: delete_file
      always: true
      risk: high
    # 下面几条是**示例，默认注释掉**：开箱就弹审批会让每一次 bash 都要人点一下，那是部署方的取舍。
    # - tool: [bash, python]
    #   pattern: '(?i)\b(rm\s+-rf|mkfs|dd\s+if=|shutdown|reboot|curl\s+[^|]*\|\s*(ba)?sh)\b'
    #   risk: high
    # - tool: [write_file, edit_file, move_file]
    #   when: target_exists
    #   risk: medium
output:
  mode: stream
  replyDelayMs: 2000
  streamBufferMs: 2000
  streamIntervalMs: 2000
  streamMinDeltaChars: 24
  maxMessageChars: 3900
media:
  dir: ./data/files
  # 媒体**文件**保留 90 天（14 §2 Q9-a）。到期只删磁盘上的文件，attachments 行与元数据留着，
  # 界面上标「已过期」。0 = 永不清理。**升级到这一版的部署，第一次维护任务就会清掉 90 天前的
  # 图片与文档** —— 不想要就在这里写 0。
  retentionDays: 90
skills:
  enabled: true
  dir: ./skills
plugins:
  enabled: true
  dir: ./plugins
mcp:
  enabled: false
schedule:
  enabled: true
  maxPerChat: 20
  minIntervalMinutes: 5
# 派生数据的保留期（每日 general.maintenanceCron 触发时按这几项删行）。**每一项 0 = 不清。**
# turns / tasks 刻意没有保留期：它们是 trace 的骨架，删掉等于历史轮次凭空消失（见 docs/11）。
maintenance:
  retention:
    usageDays: 400            # usage_ledger，每次模型调用一行
    quotaCounterDays: 400     # quota_counters 里过期账期的行（当前账期永不删）
    configRevisionDays: 180   # config_revisions，配置变更审计
    memoryRevisionDays: 180   # memory_revisions，存完整 diff
db:
  path: ./data/luoli.db
logs:
  level: info
  dir: ./logs
  captureBodies: true
quota:
  enabled: true
  requirePricing: true
webui:
  enabled: true
  host: 127.0.0.1
  port: 8787
  passwordHash: ''
